# Integración continua: en cada push ejecuta el linter y las pruebas contra PostgreSQL real.
name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: visionaula
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SECRET_KEY: solo-para-ci-no-es-un-secreto-real
      DB_ENGINE: postgresql
      DB_NAME: visionaula
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: "5432"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt ruff

      - name: Linter (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Caché de modelos ONNX
        uses: actions/cache@v4
        with:
          path: modelos/*.onnx
          key: modelos-yunet2023mar-sface2021dec

      - name: Descargar modelos (verificación SHA-256)
        run: python manage.py descargar_modelos

      - name: Verificar migraciones
        run: |
          python manage.py makemigrations --check --dry-run
          python manage.py migrate

      - name: Pruebas con cobertura
        run: pytest --cov=vision --cov=asistencia --cov-report=term-missing --cov-fail-under=80
