{% extends "base.html" %}
{% block title %}Iniciar sesión{% endblock %}
{% block public %}
<div class="login-wrap">
  <form class="card login-card" method="post">
    {% csrf_token %}
    <div class="brand brand-lg"><span class="brand-mark" aria-hidden="true"></span><span>Vision<b>Aula</b></span></div>
    <p class="muted">Control de asistencia con reconocimiento facial en tiempo real (Django + OpenCV).</p>
    {% if form.errors %}<div class="alert alert-error">Usuario o contraseña incorrectos.</div>{% endif %}
    <label>Usuario <input type="text" name="username" autocomplete="username" required autofocus></label>
    <label>Contraseña <input type="password" name="password" autocomplete="current-password" required></label>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn btn-primary btn-block" type="submit">Ingresar</button>
  </form>
</div>
{% endblock %}
